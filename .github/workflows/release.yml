# Builds Twixodus.app and publishes it to the GitHub release for the pushed
# tag. Trigger by pushing a version tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Signing has two modes, decided by which secrets exist:
#
#   * No secrets (default): the app is ad-hoc signed. It runs fine, but
#     Gatekeeper makes downloaders approve it once via System Settings →
#     Privacy & Security → "Open Anyway".
#   * Developer ID secrets set: the app is signed with the hardened runtime,
#     notarized by Apple, and stapled — it opens like any other app.
#
#     Signing secrets (always needed for the real thing):
#       DEVELOPER_ID_P12_BASE64   base64 of the "Developer ID Application"
#                                 certificate exported as .p12
#                                 (base64 -i cert.p12 | pbcopy)
#       DEVELOPER_ID_P12_PASSWORD the .p12's password
#
#     Notarization, option A — App Store Connect API key (preferred; works
#     with a key issued by whoever owns the developer account):
#       ASC_API_KEY_P8_BASE64     base64 of the AuthKey_XXXX.p8 file
#       ASC_API_KEY_ID            the key's Key ID
#       ASC_API_ISSUER_ID         the team's Issuer ID
#
#     Notarization, option B — Apple ID (fallback if A isn't set):
#       APPLE_ID                  the Apple ID that owns the certificate
#       APPLE_TEAM_ID             the 10-character team ID
#       APPLE_APP_PASSWORD        an app-specific password for notarytool
#                                 (appleid.apple.com → App-Specific Passwords)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run unit tests
        run: |
          xcodegen generate
          xcodebuild -project Twixodus.xcodeproj -scheme Twixodus \
            -configuration Debug -derivedDataPath build/DerivedData test

  release:
    name: Build & publish
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate (if configured)
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No Developer ID certificate configured — the app will be ad-hoc signed."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 -d > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "Certificate imported but no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, sign, zip
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Notarize & staple (if configured)
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$IDENTITY" = "-" ]; then
            echo "Skipping notarization (app is ad-hoc signed)."
            exit 0
          fi
          ZIP="dist/Twixodus-$VERSION.zip"
          if [ -n "$ASC_API_KEY_P8_BASE64" ]; then
            echo "Notarizing with an App Store Connect API key…"
            echo "$ASC_API_KEY_P8_BASE64" | base64 -d > AuthKey.p8
            xcrun notarytool submit "$ZIP" \
              --key AuthKey.p8 --key-id "$ASC_API_KEY_ID" \
              --issuer "$ASC_API_ISSUER_ID" --wait
            rm AuthKey.p8
          elif [ -n "$APPLE_ID" ]; then
            echo "Notarizing with an Apple ID…"
            xcrun notarytool submit "$ZIP" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
          else
            echo "Developer ID signing is set up but no notarization secrets exist." >&2
            echo "Add ASC_API_KEY_* (preferred) or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD." >&2
            exit 1
          fi
          # Staple the ticket to the app itself and re-zip, so the download
          # verifies even offline.
          APP="build/ReleaseDerivedData/Build/Products/Release/Twixodus.app"
          xcrun stapler staple "$APP"
          rm "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Twixodus-$VERSION.zip" \
            --title "Twixodus $VERSION" \
            --generate-notes
